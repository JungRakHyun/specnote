  <text x="366" y="568" fill="#94A3B8" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="15">무료 힌트 · 무제한 되돌리기</text>

  <rect x="612" y="394" width="248" height="214" rx="20" fill="#0F172A" fill-opacity="0.9" stroke="#38BDF8" stroke-width="2"/>
