  <text x="96" y="486" fill="#FFFFFF" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="28" font-weight="900">Cable Fix</text>
  <text x="96" y="532" fill="#E2E8F0" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="17" font-weight="700">엉킨 선 차근차근 정리</text>
  <text x="96" y="568" fill="#94A3B8" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="15">오프라인 · 시간제한 없음</text>

