  <text x="72" y="270" fill="#34D399" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="48" font-weight="900" letter-spacing="-1">시간 제한 · 로그인 없는 힐링 두뇌 게임</text>
  <text x="72" y="328" fill="#94A3B8" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="23" font-weight="500">Cable Fix · 꽃담(Bloom Sort) · Link Trail · Link Shift 실전 리뷰</text>

