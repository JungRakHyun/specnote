<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.78" r="0.52">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g stroke="#334155" stroke-opacity="0.24">
    <path d="M0 168H1200M0 337H1200M0 506H1200"/>
    <path d="M300 0V675M600 0V675M900 0V675"/>
  </g>

  <!-- Header Strip -->
  <rect x="72" y="58" width="160" height="40" rx="20" fill="#4F46E5"/>
  <text x="152" y="84" text-anchor="middle" fill="#FFFFFF" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="18" font-weight="800">AI 코딩 · 개발</text>
  <rect x="246" y="58" width="194" height="40" rx="20" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="343" y="84" text-anchor="middle" fill="#FDE68A" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="16" font-weight="700">실전 프롬프트 &amp; 함정</text>

  <!-- SpecNote Mark -->
  <g transform="translate(962, 62)">
    <rect width="32" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="7" y="8" width="11" height="3.5" rx="1.75" fill="#FFFFFF"/>
    <rect x="7" y="14.5" width="18" height="3.5" rx="1.75" fill="#38BDF8"/>
    <rect x="7" y="21" width="14" height="3.5" rx="1.75" fill="#34D399"/>
    <text x="44" y="23" fill="#CBD5E1" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="19" font-weight="800" letter-spacing="1">SPECNOTE</text>
  </g>

  <!-- Headline -->
  <text x="72" y="196" fill="#FFFFFF" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5">바이브 코딩 망하지 않는 법</text>
  <text x="72" y="272" fill="#FBBF24" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.2">치명적 함정 5가지 &amp; 실전 프롬프트 7선</text>
  <text x="72" y="330" fill="#94A3B8" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="24" font-weight="500">무한 에러 루프 · API 키 유출 · 코드 꼬임을 막는 실무 복사 템플릿</text>

  <!-- 2 Big Editorial Panels -->
  <rect x="72" y="392" width="508" height="218" rx="22" fill="#0F172A" fill-opacity="0.9" stroke="#F43F5E" stroke-opacity="0.65" stroke-width="2"/>
  <text x="104" y="438" fill="#FB7185" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="18" font-weight="900">초보자가 꼭 빠지는 5대 함정</text>
  <text x="104" y="482" fill="#E2E8F0" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="19" font-weight="700">✕ 한 번에 모든 기능 요구 → 코드 꼬임</text>
  <text x="104" y="518" fill="#E2E8F0" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="19" font-weight="700">✕ Git 커밋 없이 수정 → 복구 불가</text>
  <text x="104" y="554" fill="#E2E8F0" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="19" font-weight="700">✕ 프론트엔드에 API 키 하드코딩 노출</text>
  <text x="104" y="586" fill="#94A3B8" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="15">+ 무한 에러 루프 · DB 스키마 충돌 해결법</text>

  <rect x="620" y="392" width="508" height="218" rx="22" fill="#0F172A" fill-opacity="0.9" stroke="#10B981" stroke-opacity="0.75" stroke-width="2"/>
  <text x="652" y="438" fill="#34D399" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="18" font-weight="900">바로 복붙하는 실전 프롬프트 7종</text>
  <text x="652" y="482" fill="#E2E8F0" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="19" font-weight="700">✓ 1장 설계 문서(PRD) &amp; 규칙 파일 생성</text>
  <text x="652" y="518" fill="#E2E8F0" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="19" font-weight="700">✓ “코드 짜기 전 계획부터” 단계별 승인</text>
  <text x="652" y="554" fill="#E2E8F0" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="19" font-weight="700">✓ 배포 전 보안 · API 키 노출 셀프 감사</text>
  <text x="652" y="586" fill="#94A3B8" font-family="'Pretendard', 'Malgun Gothic', sans-serif" font-size="15">+ 에러 로그 전달 공식 · 리팩토링 프롬프트</text>
</svg>
